---
- name: Join Worker Nodes to Kubernetes Cluster
  hosts: control_plane
  become: yes
  tasks:
    - name: Get join command from master
      command: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Set join command as a fact
      set_fact:
        join_command: "{{ join_command_raw.stdout.strip() }}"

- name: Execute join command on worker nodes
  hosts: workers
  become: yes
  tasks:
    - name: Check if node is already part of the cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join the worker to the cluster
      command: "{{ hostvars['master']['join_command'] }}"
      when: not kubelet_conf.stat.exists
